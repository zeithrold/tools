name: Stage ESLint package

on:
  push:
    branches: [main]
    paths:
      - 'packages/eslint-config/**'
      - '.github/workflows/publish-eslint.yml'
      - 'scripts/npm-staging.mjs'
      - 'scripts/attach-publish-main.sh'

permissions:
  contents: read

concurrency:
  group: eslint-stage
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack verified artifact
        if: matrix.node == 24
        run: |
          mkdir -p "$RUNNER_TEMP/eslint-artifact"
          pnpm pack --out "$RUNNER_TEMP/eslint-artifact/package.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/eslint-artifact/source-commit.txt"
          sha256sum "$RUNNER_TEMP/eslint-artifact/package.tgz" > "$RUNNER_TEMP/eslint-artifact/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.node == 24
        with:
          name: eslint-package-${{ github.sha }}
          path: ${{ runner.temp }}/eslint-artifact/

  stage:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: eslint-package-${{ github.sha }}
          path: ${{ runner.temp }}/eslint-artifact/
      - name: Attach main at immutable source
        run: bash ../../scripts/attach-publish-main.sh
      - name: Stage with authorized stage-only token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/stage.mjs "$RUNNER_TEMP/eslint-artifact/package.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eslint-stage-result-${{ github.sha }}
          path: packages/eslint-config/stage-result.json
