name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages/frontend-checks
      - name: Lint shared stage guard
        run: packages/frontend-checks/node_modules/.bin/eslint scripts/npm-staging.mjs --config packages/frontend-checks/eslint.config.js --max-warnings 0
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/frontend-checks
      - run: |
          mkdir -p artifacts/frontend
          go build -ldflags "-X github.com/zeithrold/tools.releaseVersion=source-${{ github.event.pull_request.head.sha || github.sha }}" -o artifacts/frontend/zt ./cmd/zt
          artifacts/frontend/zt check --module frontend-checks --profile frontend --timeout 5m
      - run: pnpm run test:pack
        working-directory: packages/frontend-checks
      - run: |
          pnpm --dir packages/frontend-checks pack --pack-destination "${GITHUB_WORKSPACE}/artifacts/frontend"
          git rev-parse HEAD > artifacts/frontend/SOURCE_SHA
          cd artifacts/frontend
          sha256sum zt *.tgz SOURCE_SHA > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-${{ github.event.pull_request.head.sha || github.sha }}-node${{ matrix.node }}
          path: |
            artifacts/frontend/
            .zt/artifacts/
          include-hidden-files: true
          if-no-files-found: error
  ui:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
          run_install: false
      - name: Record immutable package source
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/SOURCE_SHA
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ui-${{ github.event.pull_request.head.sha || github.sha }}-node${{ matrix.node }}
          path: |
            packages/ui/.artifacts/
            !packages/ui/.artifacts/consumer-*/node_modules/**
            !packages/ui/.artifacts/source-consumer-*/node_modules/**
          include-hidden-files: true
          if-no-files-found: error
  public-ui-source:
    name: Public UI source (${{ matrix.revision }})
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["merged","candidate"]' || '["merged"]') }}
    runs-on: ubuntu-latest
    env:
      # Candidate verification is review evidence; only merged revisions become consumer pins.
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && (matrix.revision == 'candidate' && github.event.pull_request.head.sha || github.event.pull_request.base.sha) || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
          run_install: false
      - name: Resolve canonical source directory from pinned inventory
        id: source
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile, readFile } from 'node:fs/promises'
          import path from 'node:path'
          const inventory = JSON.parse(await readFile('registry.json', 'utf8'))
          const item = inventory.items.find(item => item.name === 'ui')
          const entry = item.files.find(file => file.target === '@ui/ztd-me/index.ts')
          const directory = path.dirname(path.dirname(entry.path))
          assert.match(directory, /^packages\/[a-z0-9-]+$/u)
          await readFile(`${directory}/scripts/source-smoke.mjs`, 'utf8')
          await appendFile(process.env.GITHUB_OUTPUT, `package_dir=${directory}\n`)
          JS
      - name: Record public source revision
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/SOURCE_SHA
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.source.outputs.package_dir }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ steps.source.outputs.package_dir }}
      - name: Install and verify immutable public registry source
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: node scripts/source-smoke.mjs "$SOURCE_SHA"
      - name: Report public installation receipt
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const receipt = JSON.parse(await readFile('.artifacts/source-consumer.json', 'utf8'))
          assert.equal(receipt.sourceSha, process.env.SOURCE_SHA)
          assert.equal(receipt.publicInstallationVerified, true)
          assert.equal(receipt.fontVerification, 'google-fonts-api')
          const requiredUiPackage = receipt.requiredUiPackage ?? receipt.requiredFrontendPackage
          assert.equal(requiredUiPackage, false)
          console.log('PUBLIC_SOURCE_VERIFIED', JSON.stringify({
            sourceSha: receipt.sourceSha,
            registryUrl: receipt.registryUrl,
            payloadSha256: receipt.payloadSha256,
            installedFiles: receipt.files.length,
            requiredUiPackage,
            fontVerification: receipt.fontVerification,
            publicInstallationVerified: receipt.publicInstallationVerified,
          }))
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-ui-source-${{ env.SOURCE_SHA }}
          path: |
            ${{ steps.source.outputs.package_dir }}/.artifacts/
            !${{ steps.source.outputs.package_dir }}/.artifacts/source-consumer-*/node_modules/**
          include-hidden-files: true
          if-no-files-found: error
  eslint:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
          run_install: false
      - name: Record ESLint candidate source
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/SOURCE_SHA
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: eslint-${{ github.event.pull_request.head.sha || github.sha }}-node${{ matrix.node }}
          path: packages/eslint-config/.artifacts/
          include-hidden-files: true
          if-no-files-found: error
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
          run_install: false
      - name: Verify immutable Action pins
        run: node --test scripts/workflow-pins.test.mjs
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/zt
