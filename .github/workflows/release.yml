name: Release zt

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Expected a semantic version tag, got: $TAG" >&2
            exit 1
          }
          go test ./...
          go vet ./...
      - name: Build archives and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="zt_${TAG}_${goos}_${goarch}"
            mkdir -p "build/$name"
            binary=zt
            if [[ "$goos" == windows ]]; then binary=zt.exe; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X github.com/zeithrold/tools.releaseVersion=$TAG" \
              -o "build/$name/$binary" ./cmd/zt
            if [[ "$goos" == windows ]]; then
              (cd "build/$name" && zip -q "../../dist/$name.zip" "$binary")
            else
              tar -C "build/$name" -czf "dist/$name.tar.gz" "$binary"
            fi
          done
          (cd dist && sha256sum zt_* > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
