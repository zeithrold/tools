# zt through mise's github backend, pinned to the published v0.1.0 release.
# `matching = "zt_"` keeps only the zt archives; mise picks the asset for the
# current OS/architecture and verifies the release SHA256SUMS (and GitHub
# artifact attestations on public GitHub).
[tools]
"github:zeithrold/tools" = { version = "0.1.0", matching = "zt_" }
